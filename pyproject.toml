[project]
name = "cargo_management"
authors = [
    { name = "Osama", email = "osama.ahmed@deliverydevs.com"}
]
description = "Cargo management app "
requires-python = ">=3.14"
readme = "README.md"
license = { file = "license.txt" }
dynamic = ["version"]
dependencies = [
    "PyQRCode~=1.2.1",
    "pypng~=0.20220715.0",
    "beautifulsoup4~=4.13.5",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = [".gitignore", "license.txt", "docs/", "scripts/", "package.json", "yarn.lock"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[project.optional-dependencies]
crypto = ["requests~=2.33.0", "psycopg2-binary~=2.9.11"]
